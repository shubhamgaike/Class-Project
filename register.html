            <a href="events.html">Events</a>

    <main>
        <section>
            <h2>Register for Techfest UGSOT 2026</h2>
            <form action="submit_registration.php" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="event">Select Event:</label>
                <select id="event" name="event" required>
                    <option value="">--Please choose an event--</option>
                    <option value="coding">Coding Competition</option>
                    <option value="dance">Dance Competition</option>
                    <option value="drama">Drama Performance</option>
                    <option value="music">Music Performance</option>
                </select><br><br>

                <input type="submit" value="Register">
            </form>
        </section>
